<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안티그래비티 재고관리 시스템 (Vibe Inventory)</title>
  <!-- Google Fonts: Pretendard & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & Babel CDNs for standalone file:// opening -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --bg-card-hover: #1f293d;
      --bg-sidebar: #0d1322;
      --border-color: #1f293d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-danger: #ef4444;
      --code-bg: #090d16;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 4px 16px rgba(6, 182, 212, 0.4);
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }
    .brand-text p {
      font-size: 0.78rem;
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-success);
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent-warning);
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent-danger);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.55rem 1rem 0.55rem 2.4rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    select {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.55rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .btn {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-primary-hover);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-muted);
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-primary));
    }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:last-child td { border-bottom: none; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 460px;
      max-width: 90vw;
      padding: 1.75rem;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Supabase Live Client Setup
    const SUPABASE_URL = "https://apwjwaryrlpqmdabilvu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwd2p3YXJ5cmxwcW1kYWJpbHZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTY2NjcsImV4cCI6MjEwMjA3MjY2N30.LLz1pxuo70srzLGRckNAPLIvgzb9rDeP8ZjWLx7ZH08";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const INITIAL_ITEMS = [
      { id: '1', item_code: 'AGY-TEST-001', name: '안티그래비티 AI 센서 모듈 v1', category: '전자부품', stock_quantity: 150, safety_stock: 30, unit_price: 45000, warehouse_location: '창고 A-12', status: 'NORMAL' },
      { id: '2', item_code: 'AGY-TEST-002', name: '고성능 임베디드 코어 제어판', category: '핵심부품', stock_quantity: 8, safety_stock: 15, unit_price: 120000, warehouse_location: '창고 B-03', status: 'LOW_STOCK' },
      { id: '3', item_code: 'AGY-TEST-003', name: '초고속 데이터 전송 케이블 2m', category: '소모품', stock_quantity: 500, safety_stock: 100, unit_price: 8500, warehouse_location: '창고 A-05', status: 'NORMAL' },
      { id: '4', item_code: 'AGY-TEST-004', name: '지능형 모터 드라이버 가이드', category: '기계부품', stock_quantity: 3, safety_stock: 10, unit_price: 89000, warehouse_location: '창고 C-01', status: 'LOW_STOCK' },
      { id: '5', item_code: 'AGY-TEST-005', name: '알루미늄 프레임 거치대 (대형)', category: '외장재', stock_quantity: 85, safety_stock: 20, unit_price: 35000, warehouse_location: '창고 A-08', status: 'NORMAL' },
    ];

    function App() {
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [loading, setLoading] = useState(false);
      const [isLiveConnected, setIsLiveConnected] = useState(false);

      // Modals
      const [isStockModalOpen, setIsStockModalOpen] = useState(false);
      const [isAddItemModalOpen, setIsAddItemModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);

      // Form States
      const [txType, setTxType] = useState('INBOUND');
      const [changeQty, setChangeQty] = useState(1);

      const [newItem, setNewItem] = useState({
        item_code: '',
        name: '',
        category: '전자부품',
        stock_quantity: 10,
        safety_stock: 5,
        unit_price: 30000,
        warehouse_location: '창고 A-01'
      });

      const fetchLiveItems = async () => {
        if (!supabaseClient) return;
        setLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('test_inventory_items')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data && data.length > 0) {
            setItems(data);
            setIsLiveConnected(true);
          }
        } catch (e) {
          console.error('Fetch live error:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchLiveItems();
      }, []);

      const handleStockUpdate = async (e) => {
        e.preventDefault();
        if (!selectedItem) return;

        const qty = Number(changeQty);
        const newQty = txType === 'INBOUND' ? selectedItem.stock_quantity + qty : Math.max(0, selectedItem.stock_quantity - qty);
        const newStatus = newQty < selectedItem.safety_stock ? 'LOW_STOCK' : 'NORMAL';

        setItems(prev => prev.map(i => i.id === selectedItem.id ? { ...i, stock_quantity: newQty, status: newStatus } : i));

        if (supabaseClient && isLiveConnected) {
          await supabaseClient.from('test_inventory_items').update({ stock_quantity: newQty, status: newStatus }).eq('id', selectedItem.id);
        }

        setIsStockModalOpen(false);
        setSelectedItem(null);
        setChangeQty(1);
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!newItem.item_code || !newItem.name) return;

        const qty = Number(newItem.stock_quantity);
        const safety = Number(newItem.safety_stock);
        const itemObj = {
          item_code: newItem.item_code.toUpperCase(),
          name: newItem.name,
          category: newItem.category,
          stock_quantity: qty,
          safety_stock: safety,
          unit_price: Number(newItem.unit_price),
          warehouse_location: newItem.warehouse_location,
          status: qty < safety ? 'LOW_STOCK' : 'NORMAL'
        };

        if (supabaseClient && isLiveConnected) {
          const { data, error } = await supabaseClient.from('test_inventory_items').insert([itemObj]).select();
          if (data && data[0]) setItems(prev => [data[0], ...prev]);
        } else {
          setItems(prev => [{ ...itemObj, id: Date.now().toString() }, ...prev]);
        }

        setIsAddItemModalOpen(false);
        setNewItem({ item_code: '', name: '', category: '전자부품', stock_quantity: 10, safety_stock: 5, unit_price: 30000, warehouse_location: '창고 A-01' });
      };

      const handleDelete = async (id, name) => {
        if (!confirm(`'${name}' 상품을 삭제하시겠습니까?`)) return;
        setItems(prev => prev.filter(i => i.id !== id));
        if (supabaseClient && isLiveConnected) {
          await supabaseClient.from('test_inventory_items').delete().eq('id', id);
        }
      };

      const filtered = items.filter(i => {
        const matchesSearch = i.name.includes(searchTerm) || i.item_code.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'ALL' || i.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      const totalStock = items.reduce((acc, i) => acc + (i.stock_quantity || 0), 0);
      const lowStockCount = items.filter(i => (i.stock_quantity || 0) < (i.safety_stock || 0)).length;
      const totalValuation = items.reduce((acc, i) => acc + ((i.stock_quantity || 0) * (i.unit_price || 0)), 0);
      const categories = ['ALL', ...Array.from(new Set(items.map(i => i.category)))];

      return (
        <div>
          <header>
            <div className="brand">
              <div className="brand-icon"><i className="fa-solid fa-boxes-stacked"></i></div>
              <div className="brand-text">
                <h1>안티그래비티 재고관리 시스템</h1>
                <p>Orca 스탠드얼론 파일(index.html) 직접 수정 및 조작 모드</p>
              </div>
            </div>
            <div className={`badge ${isLiveConnected ? 'badge-success' : 'badge-warning'}`}>
              <i className="fa-solid fa-database"></i>
              {isLiveConnected ? 'Supabase DB 실시간 연동 완료' : 'StandAlone 로컬 테스트 모드'}
            </div>
          </header>

          <main>
            {/* Stat Cards */}
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-label">전체 보유 재고량</div>
                <div className="stat-val">{totalStock.toLocaleString()} <span style={{fontSize: '1rem', color: '#6b7280'}}>개</span></div>
              </div>
              <div className="stat-card" style={{borderColor: lowStockCount > 0 ? 'rgba(239,68,68,0.5)' : ''}}>
                <div className="stat-label" style={{color: lowStockCount > 0 ? '#f87171' : ''}}>
                  <i className="fa-solid fa-triangle-exclamation"></i> 안전재고 부족 품목
                </div>
                <div className="stat-val" style={{color: lowStockCount > 0 ? '#ef4444' : '#fff'}}>{lowStockCount} <span style={{fontSize: '1rem', color: '#6b7280'}}>개 경고</span></div>
              </div>
              <div className="stat-card">
                <div className="stat-label">총 재고 자산 평가액</div>
                <div className="stat-val" style={{color: '#60a5fa'}}>₩{totalValuation.toLocaleString()}</div>
              </div>
            </div>

            {/* Toolbar */}
            <div className="toolbar">
              <div className="search-box">
                <i className="fa-solid fa-magnifying-glass"></i>
                <input 
                  type="text" 
                  placeholder="품목명 또는 SKU 코드 검색..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                />
              </div>

              <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)}>
                {categories.map(c => <option key={c} value={c}>{c === 'ALL' ? '전체 카테고리' : c}</option>)}
              </select>

              <div style={{display: 'flex', gap: '0.75rem'}}>
                <button className="btn btn-secondary" onClick={fetchLiveItems}><i className="fa-solid fa-rotate"></i> 새로고침</button>
                <button className="btn btn-cyan" onClick={() => setIsAddItemModalOpen(true)}><i className="fa-solid fa-circle-plus"></i> 신규 품목 추가</button>
              </div>
            </div>

            {/* Table */}
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>품목 코드</th>
                    <th>품목명</th>
                    <th>카테고리</th>
                    <th>보관 위치</th>
                    <th>현재 재고량</th>
                    <th>단가</th>
                    <th>상태</th>
                    <th style={{textAlign: 'right'}}>관리</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0 ? (
                    <tr><td colSpan="8" style={{textAlign: 'center', padding: '3rem', color: '#6b7280'}}>등록된 품목이 없습니다.</td></tr>
                  ) : (
                    filtered.map(item => {
                      const isLow = (item.stock_quantity || 0) < (item.safety_stock || 0);
                      return (
                        <tr key={item.id} style={{backgroundColor: isLow ? 'rgba(239,68,68,0.04)' : 'transparent'}}>
                          <td style={{fontFamily: 'Fira Code', color: '#38bdf8', fontWeight: 600}}>{item.item_code}</td>
                          <td style={{fontWeight: 600, color: '#fff'}}>{item.name}</td>
                          <td style={{color: '#9ca3af'}}>{item.category}</td>
                          <td style={{color: '#cbd5e1', fontSize: '0.85rem'}}>{item.warehouse_location}</td>
                          <td style={{fontWeight: 700, color: isLow ? '#ef4444' : '#fff'}}>
                            {item.stock_quantity} 개 <span style={{fontSize: '0.75rem', color: '#6b7280'}}>(안전: {item.safety_stock})</span>
                          </td>
                          <td style={{color: '#e5e7eb'}}>₩{(item.unit_price || 0).toLocaleString()}</td>
                          <td>
                            {isLow ? (
                              <span className="badge badge-danger"><i className="fa-solid fa-triangle-exclamation"></i> 재고부족</span>
                            ) : (
                              <span className="badge badge-success"><i className="fa-solid fa-check"></i> 정상</span>
                            )}
                          </td>
                          <td style={{textAlign: 'right'}}>
                            <div style={{display: 'flex', gap: '0.5rem', justifyContent: 'flex-end'}}>
                              <button className="btn" style={{padding: '0.35rem 0.7rem', fontSize: '0.8rem'}} onClick={() => { setSelectedItem(item); setIsStockModalOpen(true); }}>입출고</button>
                              <button className="btn badge-danger" style={{padding: '0.35rem 0.6rem', fontSize: '0.8rem'}} onClick={() => handleDelete(item.id, item.name)}><i className="fa-solid fa-trash-can"></i></button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {/* Modal: Stock */}
            {isStockModalOpen && selectedItem && (
              <div className="modal-overlay">
                <div className="modal-card">
                  <h3 style={{marginBottom: '0.4rem'}}>재고 수량 변동</h3>
                  <p style={{fontSize: '0.85rem', color: '#9ca3af', marginBottom: '1.25rem'}}>{selectedItem.name} ({selectedItem.item_code})</p>

                  <form onSubmit={handleStockUpdate}>
                    <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1rem'}}>
                      <button type="button" className={`btn ${txType === 'INBOUND' ? 'btn-cyan' : 'btn-secondary'}`} style={{flex: 1}} onClick={() => setTxType('INBOUND')}>+ 입고</button>
                      <button type="button" className={`btn ${txType === 'OUTBOUND' ? 'badge-danger' : 'btn-secondary'}`} style={{flex: 1}} onClick={() => setTxType('OUTBOUND')}>- 출고</button>
                    </div>

                    <div className="form-group">
                      <label>수량</label>
                      <input type="number" min="1" value={changeQty} onChange={e => setChangeQty(e.target.value)} />
                    </div>

                    <div style={{display: 'flex', gap: '0.75rem', justifyContent: 'flex-end', marginTop: '1.5rem'}}>
                      <button type="button" className="btn btn-secondary" onClick={() => setIsStockModalOpen(false)}>취소</button>
                      <button type="submit" className="btn btn-cyan">저장하기</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Add Item */}
            {isAddItemModalOpen && (
              <div className="modal-overlay">
                <div className="modal-card">
                  <h3 style={{marginBottom: '1.25rem'}}>신규 품목 등록</h3>
                  <form onSubmit={handleAddItem}>
                    <div className="form-group">
                      <label>품목 코드</label>
                      <input type="text" placeholder="AGY-TEST-006" required value={newItem.item_code} onChange={e => setNewItem({...newItem, item_code: e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>품목명</label>
                      <input type="text" placeholder="예: 안티그래비티 신형 센서 모듈" required value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} />
                    </div>
                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem'}}>
                      <div className="form-group">
                        <label>초기 수량</label>
                        <input type="number" min="0" value={newItem.stock_quantity} onChange={e => setNewItem({...newItem, stock_quantity: e.target.value})} />
                      </div>
                      <div className="form-group">
                        <label>안전 재고</label>
                        <input type="number" min="0" value={newItem.safety_stock} onChange={e => setNewItem({...newItem, safety_stock: e.target.value})} />
                      </div>
                    </div>
                    <div className="form-group">
                      <label>단가(원)</label>
                      <input type="number" min="0" value={newItem.unit_price} onChange={e => setNewItem({...newItem, unit_price: e.target.value})} />
                    </div>

                    <div style={{display: 'flex', gap: '0.75rem', justifyContent: 'flex-end', marginTop: '1.5rem'}}>
                      <button type="button" className="btn btn-secondary" onClick={() => setIsAddItemModalOpen(false)}>취소</button>
                      <button type="submit" className="btn btn-cyan">등록 완료</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
